[tool.poetry]
name = "run-mapper"
version = "0.1.0"
description = "A Python application for mapping runs"
authors = ["Garrett Lanigan"]
readme = "README.md"
packages = [{include = "run_mapper"}]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.115.0"
uvicorn = "^0.34.0"
gpxpy = "^1.6.0"
osmnx = "^2.0.0"
httpx = "^0.28.0"
pydantic = "^2.0"
python-multipart = "^0.0.18"
# Raster analysis dependencies
rasterio = "^1.3.9"
scipy = "^1.11.0"
scikit-image = "^0.22.0"
numpy = "^1.24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
